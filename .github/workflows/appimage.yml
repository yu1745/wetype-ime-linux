name: AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libfcitx5core-dev file qemu-user-static e2fsprogs \
            python3 unzip curl ca-certificates

      - name: Cache pinned Android NDK
        uses: actions/cache@v4
        with:
          path: .deps/tools/android-ndk-r27c
          key: ndk-r27c-linux-x86_64-27.2.12479018

      - name: Prepare pinned Android NDK
        run: |
          bash scripts/prepare_ndk.sh
          echo "ANDROID_NDK_HOME=$PWD/.deps/tools/android-ndk-r27c" >> "$GITHUB_ENV"

      - name: Cache AOSP system image
        uses: actions/cache@v4
        with:
          path: .deps/aosp
          key: aosp-arm64-v8a-28_r02

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'   # no FUSE on the runner
        run: |
          scripts/e2_img.sh
          ctest --test-dir fcitx5-wetype/build --output-on-failure
          sha256sum WeTypeIME-Engine-x86_64.AppImage > WeTypeIME-Engine-x86_64.AppImage.sha256
          cat WeTypeIME-Engine-x86_64.AppImage.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: WeTypeIME-Engine-x86_64
          path: |
            WeTypeIME-Engine-x86_64.AppImage
            WeTypeIME-Engine-x86_64.AppImage.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            WeTypeIME-Engine-x86_64.AppImage WeTypeIME-Engine-x86_64.AppImage.sha256
